name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          mkdir www assets
          cp index.html www/index.html
          cp icon.png assets/icon-only.png
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          npx cap init "Lab Hub" ge.gtu.labhub --web-dir www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#2d2468'
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lab-hub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
